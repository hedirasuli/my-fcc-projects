<!DOCTYPE html>
<!-- Document type declaration: HTML5 -->
<html lang="en">
  <!-- Root element with language set to English -->
    <head>
      <!-- Meta information and document settings -->
      <meta charset="UTF-8" />
      <!-- Character encoding: UTF-8 for full Unicode support -->
      <meta name="viewport" content="width=device-width, initial-scale=1.0" />
      <title>Emoji Reactor</title>
      <link rel="stylesheet" href="./styles.css" />
    </head>
    <body>
      <!-- Visible content of the page -->
        <main>
          <!-- Main content area -->
          <h1 class="title">How are you feeling today?</h1>

          <p class="description">
            Click on the buttons below to rate your emotions.
          </p>
          <!-- Container for all emoji buttons -->
          <div class="btn-container">
            <button id="happy-btn" class="emoji-btn" aria-label="Happy face emoji">
              <span role="img" aria-hidden="true">😊</span>
              <span class="count">0/10</span>
            </button>
            <button
              id="confused-btn"
              class="emoji-btn"
              aria-label="Confused face emoji"
            >
              <span role="img" aria-hidden="true">😕</span>
              <span class="count">0/10</span>
            </button>

            <!-- Confused emoji button -->
            <button id="sad-btn" class="emoji-btn" aria-label="Angry face emoji">
              <span role="img" aria-hidden="true">😠</span>
              <span class="count">0/10</span>
            </button>
            <button
              id="loving-btn"
              class="emoji-btn"
              aria-label="Loving face emoji"
            >
              <span role="img" aria-hidden="true">😍</span>
              <span class="count">0/10</span>
            </button>
          </div>
        </main>
        <!-- External JavaScript file containing the emoji reactor logic -->
      <script src="emoji-reactor.js"></script>
    </body>
</html>
