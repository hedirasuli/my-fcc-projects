<!doctype html>
<html lang="en">
    <head>
      <meta charset="UTF-8" />
      <meta http-equiv="X-UA-Compatible" content="IE=edge" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0" />
      <title>fCC Forum Leaderboard</title>
      <link rel="stylesheet" href="styles.css" />
    </head>
    <body>
      <!-- Header with logo and title -->
      <header>
        <nav>
          <img
            class="fcc-logo"
            src="https://cdn.freecodecamp.org/platform/universal/fcc_primary.svg"
            alt="freeCodeCamp logo"
          />
        </nav>
        <h1 class="title">Latest Topics</h1>
      </header>
      <main>
        <!-- Main content: forum leaderboard table -->
        <div class="table-wrapper">
          <table>
            <thead>
              <tr>
                <th id="topics">Topics</th>
                <th id="avatars">Avatars</th>
                <th id="replies">Replies</th>
                <th id="views">Views</th>
                <th id="activity">Activity</th>
              </tr>
            </thead>
            <!-- Dynamic table body populated by JavaScript -->
            <tbody id="posts-container"></tbody>
          </table>
        </div>
      </main>
      <!-- JavaScript for fetching and displaying forum data -->
      <script src="fcc-forum-leaderboard.js"></script>
    </body>
</html>
